name: Descargar voces para Texto a voz
# Descarga las voces de Piper (HuggingFace) y las guarda en este repositorio,
# para que la app las tome desde GitHub Pages en teléfonos donde HuggingFace está bloqueado.
on:
  workflow_dispatch:
  push:
    paths:
      - 'voces/lista.txt'
      - '.github/workflows/voces.yml'
permissions:
  contents: write
  pages: write
jobs:
  voces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar voces
        run: |
          set -e
          while read -r p; do
            [ -z "$p" ] && continue
            mkdir -p "voces/$(dirname "$p")"
            for f in "$p" "$p.json"; do
              if [ ! -s "voces/$f" ]; then
                curl -fL --retry 4 --retry-delay 5 -o "voces/$f" "https://huggingface.co/rhasspy/piper-voices/resolve/main/$f" \
                || curl -fL --retry 4 --retry-delay 5 -o "voces/$f" "https://huggingface.co/diffusionstudio/piper-voices/resolve/main/$f"
              fi
              ls -la "voces/$f"
            done
          done < voces/lista.txt
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add voces
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Voces descargadas para Texto a voz"
          git push
      - name: Publicar en GitHub Pages
        if: always()
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
